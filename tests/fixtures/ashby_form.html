<!doctype html>
<html>
  <body>
    <div class="ashby-application-form-container">
      <label for="first">First name *</label>
      <input id="first" required />
      <label for="last">Last name *</label>
      <input id="last" required />
      <label for="email">Email *</label>
      <input id="email" required />
      <label for="website">Portfolio website *</label>
      <input id="website" required />
      <label for="school">University *</label>
      <input id="school" required />
      <label for="resume">Resume *</label>
      <input id="resume" type="file" required />
      <label for="citizen">Are you a United States citizen? *</label>
      <select id="citizen" required>
        <option value="">Select</option>
        <option>Yes</option>
        <option>No</option>
      </select>
      <div class="ashby-application-form-field-entry">
        <div class="ashby-application-form-question-title">Will you require sponsorship? *</div>
        <input type="hidden" required />
        <button
          class="ashby-application-form-input-yesno-option"
          data-option="yes"
          type="button"
        >
          Yes
        </button>
        <button
          class="ashby-application-form-input-yesno-option"
          data-option="no"
          type="button"
        >
          No
        </button>
      </div>
      <button class="ashby-application-form-submit-button" type="button">
        Submit Application
      </button>
    </div>
    <script>
      document
        .querySelector(".ashby-application-form-submit-button")
        .addEventListener("click", () => {
          document.body.innerHTML =
            '<main class="ashby-application-form-success-container">Application Received</main>';
      });
    </script>
  </body>
</html>
